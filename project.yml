name: FoodTrip
options:
  bundleIdPrefix: app.getfoodtrip
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only for v1
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  FoodTrip:
    type: application
    platform: iOS
    sources:
      - path: FoodTrip
        excludes: [PrivacyInfo.xcprivacy]
      - path: FoodTrip/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: FoodTrip/Info.plist
      properties:
        CFBundleDisplayName: FoodTrip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.food-and-drink
        NSCalendarsWriteOnlyAccessUsageDescription: FoodTrip adds the meals you choose to your calendar. It can only add events; it cannot read your calendar.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getfoodtrip.foodtrip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [FoodTripTests]
      storeKitConfiguration: FoodTrip/Resources/Products.storekit

  FoodTripTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoodTripTests
      - path: scripts/planner-vectors.json
        buildPhase: resources
    dependencies:
      - target: FoodTrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getfoodtrip.foodtrip.tests
        GENERATE_INFOPLIST_FILE: true
